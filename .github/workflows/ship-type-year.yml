name: Build Ship Type Year SWBS Regression
on:
  workflow_dispatch:
  push:
    branches: [ship-type-year]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ship_type_year
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0 pillow==11.3.0
      - name: Prepare desktop preview
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - run: python -m unittest discover -s tests -v
        env:
          UI_SCREENSHOT: '1'
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SWBS_Regression --add-data "assets;assets" app.py
      - name: Verify bundled equation renderer
        shell: pwsh
        run: |
          $output = Join-Path (Get-Location) "frozen-equation.png"
          $check = Start-Process -FilePath "dist/SWBS_Regression.exe" -ArgumentList @('--verify-equation-renderer', $output) -PassThru -Wait
          if ($check.ExitCode -ne 0 -or !(Test-Path $output)) { throw "Bundled equation renderer failed" }
          if ((Get-Item $output).Length -lt 1000) { throw "Equation image is empty" }
      - name: Verify bundled nonlinear regression engine
        shell: pwsh
        run: |
          $output = Join-Path (Get-Location) "frozen-regression.txt"
          $check = Start-Process -FilePath "dist/SWBS_Regression.exe" -ArgumentList @('--verify-regression-engine', $output) -PassThru -Wait
          if ($check.ExitCode -ne 0 -or !(Test-Path $output)) { throw "Bundled regression engine failed" }
      - name: Verify EXE starts
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "dist/SWBS_Regression.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "EXE exited: $($app.ExitCode)" }
          Stop-Process -Id $app.Id
      - uses: actions/upload-artifact@v4
        with:
          name: SWBS-Regression-Ship-Type-Year
          path: ship_type_year/dist/SWBS_Regression.exe
      - name: Publish separate release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ship-type-year-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" dist/SWBS_Regression.exe ship-type-year-preview.png ship-type-year-equations.png year-search-preview.png type-size-coefficients.png --target "$GITHUB_SHA" --title "SWBS Regression - Ship Type Year ${GITHUB_RUN_NUMBER}" --notes "Compare three candidate equations for every SWBS100-600 and net lightship model. Search 0-100% year effects for each formula and select the lowest full-fleet training MAPE. Includes positive additive models, animated progress and final equations only. Opens SWBS100 after training. Removed formula comparison UI and patrol boat design option. Re-upload the full fleet to refit. Existing versions remain unchanged."
